<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --a1: #38bdf8; --a2: #a5b4fc; --on: #06121f;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
[data-theme="dark"] {
  --bg1: #0e2240; --bg2: #27427a;
  --card: rgba(255,255,255,.08); --border: rgba(255,255,255,.16);
  --text: #f3f4f6; --muted: #aab0bd; --bot: rgba(255,255,255,.10);
  --pc: rgba(255,255,255,.06); --input: rgba(0,0,0,.28); --err: #ffb4b4;
}
[data-theme="light"] {
  --bg1: #eaf5ff; --bg2: #d3e4fb;
  --card: rgba(255,255,255,.62); --border: rgba(0,0,0,.10);
  --text: #1b2030; --muted: #566072; --bot: rgba(255,255,255,.88);
  --pc: rgba(0,0,0,.055); --input: rgba(255,255,255,.92); --err: #a11a1a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); color: var(--text);
  background: linear-gradient(135deg, var(--bg1), var(--bg2)) fixed;
  display: flex; justify-content: center; align-items: center;
  padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  overflow: hidden; transition: background .4s;
}
body::before {
  content: ""; position: fixed; inset: -140px; pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle at 25% 60%, var(--pc) 0 22px, transparent 23px), radial-gradient(circle at 50% 45%, var(--pc) 0 30px, transparent 31px), radial-gradient(circle at 75% 60%, var(--pc) 0 22px, transparent 23px);
  background-size: 200px 120px, 200px 120px, 200px 120px;
  animation: drift 40s ease-in-out infinite alternate;
}
@keyframes drift { from { transform: translate3d(0,0,0); } to { transform: translate3d(70px,50px,0); } }
.app {
  position: relative; z-index: 1; width: 100%; max-width: 880px; height: 100%; max-height: 900px;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--card); border: 1px solid var(--border); border-radius: 22px;
  backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
  box-shadow: 0 24px 60px rgba(0,0,0,.28);
}
header {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.badge {
  width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center;
  font-size: 24px; background: linear-gradient(135deg, var(--a1), var(--a2));
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.titles { min-width: 0; flex: 1; }
h1 { margin: 0; font-size: 1.12rem; font-weight: 700; line-height: 1.25; }
.subtitle { margin: 2px 0 0; font-size: .8rem; color: var(--muted); line-height: 1.35; }
.status { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); margin-top: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 2s infinite; }
.dot.off { background: #ef4444; animation: none; }
.dot.warn { background: #f59e0b; animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
.tools { display: flex; gap: 8px; flex: none; }
.btn-ghost {
  font: inherit; font-size: .8rem; color: var(--text); cursor: pointer;
  background: var(--input); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
  transition: transform .15s, border-color .2s;
}
.btn-ghost:hover { border-color: var(--a1); transform: translateY(-1px); }
#messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.msg { max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: .94rem; line-height: 1.6; word-wrap: break-word; overflow-wrap: anywhere; animation: pop .28s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.msg.user { align-self: flex-end; color: var(--on); background: linear-gradient(135deg, var(--a1), var(--a2)); border-bottom-right-radius: 5px; white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
.msg.error { color: var(--err); border-color: var(--err); }
.msg p { margin: 0 0 .55em; } .msg p:last-child { margin-bottom: 0; }
.msg ul { margin: .3em 0 .6em; padding-left: 1.3em; }
.msg code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .86em; background: rgba(127,127,127,.22); padding: 1px 5px; border-radius: 5px; }
.msg pre { margin: .5em 0; padding: 12px; overflow-x: auto; border-radius: 10px; background: rgba(0,0,0,.42); color: #f1f5f9; }
.msg pre code { background: none; padding: 0; color: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { font: inherit; font-size: .82rem; color: var(--text); cursor: pointer; background: var(--input); border: 1px solid var(--border); border-radius: 999px; padding: 7px 13px; transition: border-color .2s, transform .15s; }
.chip:hover { border-color: var(--a1); transform: translateY(-1px); }
.typing { display: inline-flex; gap: 5px; padding: 15px 16px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--a1); animation: bounce 1.1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-6px); opacity: 1; } }
.composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 16px 8px; border-top: 1px solid var(--border); }
textarea {
  flex: 1; resize: none; max-height: 140px; min-height: 46px; font: inherit; font-size: .94rem; color: var(--text);
  background: var(--input); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; outline: none; transition: border-color .2s, box-shadow .2s;
}
textarea::placeholder { color: var(--muted); }
textarea:focus { border-color: var(--a1); box-shadow: 0 0 0 3px rgba(127,127,127,.2); }
#send {
  font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 14px; padding: 0 22px; height: 46px;
  color: var(--on); background: linear-gradient(135deg, var(--a1), var(--a2)); transition: transform .15s, opacity .2s;
}
#send:hover:not(:disabled) { transform: translateY(-1px); }
#send:disabled { opacity: .5; cursor: not-allowed; }
.note { text-align: center; font-size: .72rem; color: var(--muted); padding: 0 16px 12px; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
@media (max-width: 600px) {
  body { padding: 0; }
  .app { border-radius: 0; max-height: none; border-left: 0; border-right: 0; }
  header { padding: 12px; } .subtitle { display: none; }
  .msg { max-width: 92%; } #messages { padding: 12px; }
  .btn-ghost { padding: 8px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="badge" aria-hidden="true">☁️</div>
    <div class="titles">
      <h1>{{ title }}</h1>
      <p class="subtitle">{{ subtitle }}</p>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking status...</span></div>
    </div>
    <div class="tools">
      <button class="btn-ghost" id="themeBtn" type="button" aria-label="Switch light or dark mode">Light</button>
      <button class="btn-ghost" id="clearBtn" type="button">Clear chat</button>
    </div>
  </header>

  <section id="messages" aria-live="polite"></section>

  <div class="composer">
    <textarea id="input" rows="1" maxlength="2000" placeholder="Type your question..." aria-label="Your message"></textarea>
    <button id="send" type="button">Send</button>
  </div>
  <div class="note">Press Enter to send, Shift+Enter for a new line. Answers may contain mistakes, so double-check important facts.</div>
</main>

<script>
(function () {
  var WELCOME = {{ welcome|tojson }};
  var SUGGESTIONS = {{ suggestions|tojson }};
  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var clearBtn = document.getElementById("clearBtn");
  var themeBtn = document.getElementById("themeBtn");
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("statusText");
  var history = [];
  var busy = false;

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Small, safe Markdown renderer: text is escaped first, then simple formatting is added.
  function render(text) {
    return text.split("```").map(function (part, i) {
      if (i % 2 === 1) {
        var code = part.replace(/^[a-zA-Z0-9+#_-]*\n/, "");
        return "<pre><code>" + esc(code.trim()) + "</code></pre>";
      }
      var html = esc(part)
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      var out = "", inList = false;
      html.split("\n").forEach(function (line) {
        var li = line.match(/^\s*(?:[-*\u2022]|\d+[.)])\s+(.*)$/);
        var head = line.match(/^#{1,6}\s+(.*)$/);
        if (li) {
          if (!inList) { out += "<ul>"; inList = true; }
          out += "<li>" + li[1] + "</li>";
          return;
        }
        if (inList) { out += "</ul>"; inList = false; }
        if (head) { out += "<p><strong>" + head[1] + "</strong></p>"; }
        else if (line.trim() !== "") { out += "<p>" + line + "</p>"; }
      });
      if (inList) out += "</ul>";
      return out;
    }).join("");
  }

  function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addMessage(role, text, isError) {
    var div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot") + (isError ? " error" : "");
    if (role === "user") { div.textContent = text; } else { div.innerHTML = render(text); }
    messagesEl.appendChild(div);
    scrollDown();
    return div;
  }

  function showWelcome() {
    var div = addMessage("bot", WELCOME, false);
    var chips = document.createElement("div");
    chips.className = "chips";
    SUGGESTIONS.forEach(function (q) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = q;
      b.addEventListener("click", function () { send(q); });
      chips.appendChild(b);
    });
    div.appendChild(chips);
  }

  function showTyping() {
    var div = document.createElement("div");
    div.className = "msg bot typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    scrollDown();
    return div;
  }

  function setBusy(state) {
    busy = state;
    sendBtn.disabled = state;
    inputEl.disabled = state;
    if (!state) inputEl.focus();
  }

  function send(textOverride) {
    var text = (typeof textOverride === "string" ? textOverride : inputEl.value).trim();
    if (!text || busy) return;
    addMessage("user", text, false);
    inputEl.value = "";
    inputEl.style.height = "auto";
    setBusy(true);
    var typing = showTyping();

    fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history.slice(-12) })
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          return { ok: res.ok, data: data };
        });
      })
      .then(function (r) {
        typing.remove();
        if (r.ok && r.data.reply) {
          addMessage("bot", r.data.reply, false);
          history.push({ role: "user", content: text });
          history.push({ role: "bot", content: r.data.reply });
        } else {
          addMessage("bot", r.data.error || "Something went wrong. Please try again.", true);
        }
      })
      .catch(function () {
        typing.remove();
        addMessage("bot", "Could not reach the server. Check your connection and try again.", true);
      })
      .then(function () { setBusy(false); });
  }

  function checkHealth() {
    fetch("/health").then(function (r) { return r.json(); }).then(function (d) {
      if (d.api_key_configured) {
        dot.className = "dot"; statusText.textContent = "Online";
      } else {
        dot.className = "dot warn"; statusText.textContent = "API key missing on server";
      }
    }).catch(function () {
      dot.className = "dot off"; statusText.textContent = "Offline";
    });
  }

  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = t === "dark" ? "Light" : "Dark";
  }

  sendBtn.addEventListener("click", function () { send(); });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", function () {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });
  clearBtn.addEventListener("click", function () {
    history = [];
    messagesEl.innerHTML = "";
    showWelcome();
  });
  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  var saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  applyTheme(saved === "light" ? "light" : "dark");
  showWelcome();
  checkHealth();
  setInterval(checkHealth, 30000);
})();
</script>
</body>
</html>
